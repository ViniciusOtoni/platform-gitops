# Workload Identity: cada ServiceAccount troca seu token pelo da managed identity criada no
# módulo domain-runtime (federated credential: system:serviceaccount:pedidos:<nome>).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pedidos-api
  annotations:
    azure.workload.identity/client-id: "${PEDIDOS_PEDIDOS_API_CLIENT_ID}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: outbox-relay
  annotations:
    azure.workload.identity/client-id: "${PEDIDOS_OUTBOX_RELAY_CLIENT_ID}"
