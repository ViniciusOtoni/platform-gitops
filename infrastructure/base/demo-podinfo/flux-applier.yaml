# A extensão Flux do AKS aplica multi-tenancy: HelmReleases rodam com a ServiceAccount
# "flux-applier" do PRÓPRIO namespace. Damos a ela admin apenas neste namespace (isolamento por tenant).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-applier
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-applier-admin
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: demo
