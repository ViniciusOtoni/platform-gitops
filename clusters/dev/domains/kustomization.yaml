# Raiz da Kustomization Flux "domains" (depende de "infrastructure").
# Onboarding de domínio = adicionar ../../../domains/<dominio>/overlays/dev aqui (via PR).
# Variáveis ${...} são substituídas pelo Flux (postBuild.substitute) com valores
